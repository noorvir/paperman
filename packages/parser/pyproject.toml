[project]
name = "paperman-parser"
version = "0.1.0"
description = "Stateless document OCR, splitting, field extraction, and tagging"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.11", "pydantic-ai-slim[openai]>=1.0",
  "pypdf>=6", "ocrmypdf>=17",
]

[dependency-groups]
dev = [
  "basedpyright>=1.29", "ruff>=0.11", "pytest>=8",
  "fpdf2>=2.8.9", "pillow>=12.3.0", "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
include = ["paperman_parser", "tests", "scripts"]

[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
