[project]
name = "paperman"
version = "0.1.0"
description = "Private document processing with filesystem state"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic>=2.11",
  "pydantic-settings>=2.8", "pydantic-ai-slim[openai]>=1.0",
  "pypdf>=6", "ocrmypdf>=17", "tomli-w>=1.2", "watchfiles>=1",
  "filelock>=3.18", "python-multipart>=0.0.20",
]
[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "ruff>=0.11",
    "pytest>=8",
    "httpx>=0.28",
    "fpdf2>=2.8.9",
    "pillow>=12.3.0",
    "httpx2>=2.13.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project.scripts]
paperman = "paperman.cli:main"
[tool.basedpyright]
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
include = ["paperman", "tests", "scripts"]
[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
